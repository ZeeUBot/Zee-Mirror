version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
        # Only auto-apply minor/patch bumps. Major upgrades (e.g. eslint 10,
        # tailwindcss 4, typescript 7) require deliberate migration and must
        # not ride along in a grouped automated PR.
        update-types:
          - "minor"
          - "patch"
