version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    ignore:
      # Major bumps need a deliberate migration and land as individual PRs
      # (groups only filter what enters the group, they do not suppress the
      # rest). eslint 10 is blocked upstream: eslint-plugin-react declares
      # peer eslint "^3..^9.7", so `npm ci` cannot resolve it. Drop this rule
      # once the plugin set supports eslint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns:
          - "*"
